<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Neural Radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #050507;
    --panel: rgba(12, 12, 16, 0.92);
    --line: rgba(255, 255, 255, 0.08);
    --text: #ececf1;
    --muted: #8a8a96;
    --need: #ff6b9a;
    --approve: #ffc966;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; }

  .topbar { position: fixed; top: 18px; left: 22px; right: 22px; display: flex; align-items: center; gap: 12px; pointer-events: none; z-index: 3; }
  .queue { display: flex; gap: 6px; pointer-events: auto; margin-left: auto; }
  .chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); cursor: pointer; color: var(--text); font: inherit; font-size: 12px; }
  .chip:hover { border-color: rgba(255,255,255,.22); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: currentColor; }
  .controls { display: flex; gap: 6px; pointer-events: auto; }
  .layouts { display: flex; gap: 4px; pointer-events: auto; }
  .layouts button { font: inherit; font-size: 11.5px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .layouts button.on { color: var(--text); border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.06); }
  body.embed .queue, body.embed .controls, body.embed .layouts { display: none; }
  .btn { font: inherit; font-size: 12px; color: var(--text); background: rgba(255,255,255,.04); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 7px; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.09); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: #f2f2f5; color: #0b0b0e; border-color: transparent; font-weight: 600; }
  .btn.danger { color: #ff9ab5; }
  .btn.ghost { background: transparent; border-color: transparent; }


  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: rgba(10, 10, 14, 0.96);
    border-left: 1px solid var(--line); backdrop-filter: blur(16px); padding: 22px 20px;
    overflow-y: auto; transform: translateX(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1), box-shadow .32s; z-index: 6; }
  .panel.open { transform: none; box-shadow: -24px 0 60px rgba(0,0,0,.55); }
  .panel h2 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel .close { position: absolute; top: 12px; right: 12px; }
  .status { display: inline-block; font-size: 11px; margin-top: 6px; letter-spacing: .04em; }
  .meter { margin: 14px 0 4px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: linear-gradient(90deg, #34d399, #2aa7a0, #4f6bed, #a855f7); transition: width .5s; }
  .meta { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  .section { margin-top: 18px; }
  .section h4 { margin: 0 0 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
  .ask { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 10px; padding: 12px; }
  .ask p { margin: 0 0 10px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  textarea { width: 100%; resize: vertical; min-height: 54px; font: inherit; color: var(--text);
    background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; }
  textarea:focus { border-color: rgba(255,255,255,.25); }
  .sendrow { display: flex; justify-content: flex-end; margin-top: 6px; gap: 6px; align-items: center; }
  .sendrow span { flex: 1; color: var(--muted); font-size: 11px; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sub { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .sub:last-child { border-bottom: 0; }
  .sub .n { flex: 1; }
  .sub .n small { display: block; color: var(--muted); }
  .sub.hl { background: rgba(255,255,255,.04); border-radius: 6px; padding-left: 6px; }
  .mini { font-size: 11px; padding: 3px 8px; }
  .log { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: #a3a3ad;
    max-height: 220px; overflow-y: auto; overflow-x: hidden; overflow-wrap: anywhere; overscroll-behavior: contain; padding-right: 4px; }
  .log div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
  .log .you { color: #d8c8ff; }
  .log time { color: #55555f; margin-right: 6px; }
  .fold { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
  .fold:hover { color: var(--text, #e6e6ea); }
  .fold .caret { display: inline-block; transition: transform .15s; }
  .fold.open .caret { transform: rotate(90deg); }
  .ctx { color: var(--muted); font-size: 12px; margin: 0 0 8px; padding-left: 8px; border-left: 2px solid var(--line); }
  .empty { color: var(--muted); font-size: 12px; }

  .empty-state { position: fixed; left: 50%; top: 50%; transform: translate(-50%, 70px); color: var(--muted); font-size: 12px;
    text-align: center; max-width: 320px; pointer-events: none; z-index: 2; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(10px); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 8; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 2px; }
  .chips span { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .note { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .btn.confirm { border-color: rgba(255,107,154,.6); color: #ffb3c8; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  @media (max-width: 760px) {
    .topbar { left: 12px; right: 12px; top: 10px; flex-wrap: wrap; }
    .queue { margin-left: 0; order: 3; width: 100%; overflow-x: auto; }
    .controls { margin-left: auto; }
    .panel { left: 0; width: auto; top: 30%; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; transform: translateY(100%); }
  }
</style>
</head>

    stop: '停止',
    confirmStop: '确认停止',

    activityHeading: '活动（{n}）',
    nothingYet: '暂无记录',
    close: '关闭',
    log_you: '你：{text}',
    log_launch: '启动了 {agent}：{text}',
    log_ask: '向你提了一个问题',
    log_tool: '使用了 {tool}',
    log_toolRunning: '正在使用 {tool}…',
    emptyConnecting: '正在等待神经雷达插件…',
    emptyError: 'PI-Desktop 没有响应：{error}',
    emptyNone: '没有正在运行的智能体。智能体一开始工作，雷达就会显示出来。',
    toastFailed: '操作未成功',
    toastSent: '已发送给智能体',
    toastSuggested: '已填入会话输入框',
    toastApproved: '计划已批准',
    toastRejected: '计划已拒绝',
    toastStop: '已请求停止',
    toastAborted: '本回合已中止',
    err_not_pending: '此审批已不再等待处理',
  },
};
// the host's language (appearance.locale, BCP-47), else the webview's
const pickLocale = l => /^zh/i.test(String(l || '')) ? 'zh-CN' : 'en';
let locale = pickLocale(navigator.language);
function t(key, vars) {
  const s = COPY[locale][key] ?? COPY.en[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m)) : s;
}
const plural = (n, one, many) => t(n === 1 ? one : many, { n });
const statusLabel = s => (COPY.en['status_' + s] ? t('status_' + s) : String(s || ''));
// an agent is named after its session, as in PI-Desktop's session list
const nameOf = (a, max = 34) => clip(a.title || t('untitledSession'), max);
const descOf = a => a.desc || a.title || t('untitledSession');
const taskOf = a => a.task || a.title || t('untitledSession');
function logLine(l) {
  switch (l.kind) {
    case 'you': return t('log_you', { text: l.text || '' });
    case 'launch': return t('log_launch', { agent: l.agent || t('subagent'), text: l.text || '' });
    case 'ask': return t('log_ask');
    case 'tool': return t(l.running ? 'log_toolRunning' : 'log_tool', { tool: l.tool || '' });
    default: return String(l.text || '');
  }
}

const ST = { need: '#ff6b9a', approve: '#ffc966', run: '#5eead4', paused: '#8a8f9c', done: '#6b7080', stopped: '#6b7080' };
const YOU_SIGNAL = '#d8c8ff';
const HANDOFF = '#8fb8ff'; // agent hands a task to a subagent

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const bg = document.createElement('canvas');
const bgx = bg.getContext('2d');
let W = 0, H = 0, DPR = 1, K = 1;

// ---------- helpers ----------
const now = () => performance.now() / 1000;
const fmt = () => new Date().toTimeString().slice(0, 8);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const clip = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

// Edge colour by distance from you: purple → blue → teal → green (as in the reference)
const STOPS = [[0, rgb('#a855f7')], [0.4, rgb('#5b5fe0')], [0.68, rgb('#2a9fa5')], [1, rgb('#34d399')]];
function grad(u) {
  u = clamp(u, 0, 1);
  for (let i = 1; i < STOPS.length; i++) if (u <= STOPS[i][0]) {
    const [u0, c0] = STOPS[i - 1], [u1, c1] = STOPS[i], k = (u - u0) / (u1 - u0);
    return [lerp(c0[0], c1[0], k) | 0, lerp(c0[1], c1[1], k) | 0, lerp(c0[2], c1[2], k) | 0];
  }
  return STOPS[STOPS.length - 1][1];
}

// ---------- layouts: same network, six ways to place you and the agents ----------
// 1 Radar:   you at the centre; urgent, waiting and working agents on separate rings around you
// 2 Flow:    you on the left; columns to the right: urgent, waiting, working, done
// 3 Cascade: you at the top; rows below you, from urgent down to done
// 4 Horizon: you at the bottom centre; agents on arcs above you, like a half radar
// 5 Corner:  you in the lower-left corner; quarter arcs spread toward the upper right
// 6 Band:    you at the lower left; agents along a diagonal band, drifting away as they need you less
const params = new URLSearchParams(location.search);
const LAYOUT = 1;
const EMBED = false;
const box = { x: 0, y: 0, w: 0, h: 0 }, boxT = { x: 0, y: 0, w: 0, h: 0 }, boxBase = { x: 0, y: 0, w: 0, h: 0 };
// the area you and the agents live in: leaves room for the top bar, labels and side panel
function computeView() {
  const mobile = W < 760, availW = selected && W > 900 ? W - 400 : W;
  const top = mobile ? 70 : 64, bottom = (mobile ? 64 : 70) + (LAYOUT === 4 || LAYOUT === 5 ? 50 : 0);
  const side = mobile ? 44 : Math.max(130, availW * 0.09);
  boxBase.x = side; boxBase.y = top; boxBase.w = Math.max(160, availW - side * 2); boxBase.h = Math.max(160, H - top - bottom);
  Object.assign(boxT, boxBase);
}
// the centre of the part of the screen the drawer leaves visible
function viewCentre() {
  const mobile = W < 760, top = mobile ? 70 : 64;
  if (selected && mobile) return [W / 2, (top + H * 0.3) / 2];   // the drawer covers the lower 70%
  const w = selected ? W - 400 : W;
  return [w / 2, (top + H) / 2];
}
// status tiers, each at its own distance from you so they never blur together
function tierOf(a) { return { need: 0, approve: 1, run: 2, paused: 2, done: 3, stopped: 3 }[a.status] ?? 2; }
const TIER_R = [0.44, 0.66, 0.87, 1.02];
function youAnchor() {
  const b = box;
  if (LAYOUT === 2) return [b.x, b.y + b.h / 2];
  if (LAYOUT === 3) return [b.x + b.w / 2, b.y];
  if (LAYOUT === 4) return [b.x + b.w / 2, b.y + b.h];
  if (LAYOUT === 5) return [b.x, b.y + b.h];
  if (LAYOUT === 6) return [b.x, b.y + b.h * 0.85];
  return [b.x + b.w / 2, b.y + b.h / 2];
}
// each agent keeps its own lane; when its status changes it only moves closer to you or further away
// the fan of subagents behind an agent widens with their number, so up to 6 stay readable
function fanArc(n) { return n > 3 ? Math.min(1.5 + (n - 3) * 0.5, 3.0) : 1.5; }
function fanR(n) { return 70 + Math.max(0, n - 3) * 16; }
function placeAgent(a) {
  const b = box, [yx, yy] = youAnchor(), tier = tierOf(a);
  const r = TIER_R[tier] + ((1 - a.attention) - 0.5) * 0.06;   // a small nudge inside its tier
  const f = a.lane;
  const polar = (R, th) => [yx + Math.cos(th) * r * R, yy + Math.sin(th) * r * R];
  switch (LAYOUT) {
    case 2: return [b.x + r * b.w, b.y + (0.08 + f * 0.84) * b.h];
    case 3: return [b.x + (0.06 + f * 0.88) * b.w, b.y + r * b.h];
    case 4: return polar(Math.min(b.w / 2, b.h), Math.PI + (0.08 + f * 0.84) * Math.PI);
    case 5: return polar(Math.min(b.w, b.h), -Math.PI / 2 + (0.06 + f * 0.88) * Math.PI / 2);
    case 6: {
      const ex = b.x + b.w, ey = b.y + b.h * 0.12, L = Math.hypot(ex - yx, ey - yy);
      const ux = (ex - yx) / L, uy = (ey - yy) / L, w = Math.min(b.h, b.w) * 0.62;
      return [yx + ux * r * L - uy * (f - 0.5) * w, yy + uy * r * L + ux * (f - 0.5) * w];
    }
    default: return polar(Math.min(b.w, b.h) / 2, -Math.PI / 2 + f * Math.PI * 2);
  }
}
function farDist() {
  const b = box; let m = 1;
  for (const [x, y] of [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]]) m = Math.max(m, Math.hypot(x - you.x, y - you.y));
  return m;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [canvas, bg]) { c.width = W * DPR; c.height = H * DPR; }
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
  K = clamp(Math.min(W * 0.75, H) / 800, 0.7, 1.25);
  computeView();
  if (!box.w) Object.assign(box, boxT);
  // flat dark background with the reference's soft purple / green wash
  bgx.fillStyle = '#050507'; bgx.fillRect(0, 0, W, H);
  const p = bgx.createRadialGradient(W * 0.08, H * 0.72, 0, W * 0.08, H * 0.72, W * 0.42);
  p.addColorStop(0, 'rgba(124,58,237,0.16)'); p.addColorStop(1, 'rgba(124,58,237,0)');
  bgx.fillStyle = p; bgx.fillRect(0, 0, W, H);
  const g = bgx.createRadialGradient(W * 0.82, H * 0.3, 0, W * 0.82, H * 0.3, W * 0.4);
  g.addColorStop(0, 'rgba(16,185,129,0.12)'); g.addColorStop(1, 'rgba(16,185,129,0)');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);
}

// ---------- the network ----------
function mkPt(owner, ox, oy, r, hub = false) {
  return { owner, ox, oy, r, hub, ph: Math.random() * 6.28, f: 0.15 + Math.random() * 0.35, amp: 2 + Math.random() * 4, x: 0, y: 0, glow: 0 };
}
// tissue: points spread evenly over the whole screen and a little beyond, so lines run in from every border
const filler = [];

  for (const sp of spikes) {
    const trail = 70 * K, head = sp.s;
    let c = 0;
    const [r, g, b] = sp.color, base = sp.faint ? 0.45 : 0.95;
    for (let i = 1; i < sp.path.length; i++) {
      const A = sp.path[i - 1], B = sp.path[i], L = Math.hypot(B.x - A.x, B.y - A.y) || 1;
      const s0 = Math.max(c, head - trail), s1 = Math.min(c + L, head);
      if (s1 > s0) {
        const k0 = (s0 - c) / L, k1 = (s1 - c) / L;
        const x0 = lerp(A.x, B.x, k0), y0 = lerp(A.y, B.y, k0), x1 = lerp(A.x, B.x, k1), y1 = lerp(A.y, B.y, k1);
        const gr = ctx.createLinearGradient(x0, y0, x1, y1);
        const a0 = base * (1 - (head - s0) / trail), a1 = base * (1 - (head - s1) / trail);
        gr.addColorStop(0, `rgba(${r},${g},${b},${Math.max(0, a0)})`); gr.addColorStop(1, `rgba(${r},${g},${b},${Math.max(0, a1)})`);
        ctx.strokeStyle = gr; ctx.lineWidth = sp.faint ? 0.9 : 1.5;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
      if (head >= c && head <= c + L) {
        const k = (head - c) / L;
        ctx.fillStyle = `rgba(${r},${g},${b},${base})`;
        ctx.beginPath(); ctx.arc(lerp(A.x, B.x, k), lerp(A.y, B.y, k), sp.faint ? 1.3 : 2, 0, 7); ctx.fill();
      }
      c += L;
    }
  }

  // points
  const drawPoint = (p, alpha = 0.9) => {
    let r = p.r, col = '#ffffff';
    if (isDim(p)) alpha = Math.min(alpha, 0.4);
    if (!p.owner) { alpha *= edgeFade(p.x, p.y); if (alpha < 0.01) return; }
    if (p.hub && p.owner !== you) {
      const o = p.owner;
      col = ST[o.status] || '#ffffff';
      if (o.status === 'need' || o.status === 'approve') r = p.r + 1.2 * (0.5 + 0.5 * Math.sin(time * 3 + o.seed));
      if (o.flash) r += o.flash * 1.8;
    }
    if (p.owner === you && p.hub) {
      r = p.r + you.flash * 2.5;
      // you are the agent: the centre takes its colour while it waits for you
      if (solo && (solo.status === 'need' || solo.status === 'approve')) { col = ST[solo.status]; r += 1.4 * (0.5 + 0.5 * Math.sin(time * 3 + solo.seed)); }
    }
    ctx.globalAlpha = alpha; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  };
  for (const p of nodes) if (!p.hidden) drawPoint(p);
  ctx.globalAlpha = 1;
  // repaint an agent's (or your) own cluster over the labels beneath it, so it keeps its layer
  const redrawCluster = o => {
    ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    for (const e of edges) {
      if (e.a.owner !== o || e.b.owner !== o || e.a.hidden || e.b.hidden) continue;
      ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke();
    }
    for (const p of o.pts) if (!p.hidden) drawPoint(p);
    ctx.globalAlpha = 1;
  };

  // labels sit on small dark pills so they read over the mesh
  ctx.textBaseline = 'alphabetic';
  const pill = (x, y, w, h, alpha = 1, accent = null) => {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(12,12,18,0.82)'; ctx.strokeStyle = accent || 'rgba(255,255,255,0.09)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 7); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  };
  const statusText = a => {
    const n = a.subs.filter(x => x.status === 'run').length;
    return `${a.reply ? t('needsReply') : statusLabel(a.status)}${n ? ` · ${plural(n, 'subagentsOne', 'subagentsMany')}` : ''}`;
  };
  // stacking order, bottom to top: subagents < agents < You (main). Later draws cover earlier ones.
  // agent label layout first, so the You label can dodge it and subagents can be drawn underneath
  const availW = selected && W > 900 ? W - 400 : W;
  const agentLabels = [];
  for (const a of agents) {
    if (a === solo) { a.label = null; continue; }
    // line 1: the session title and status; line 2: what it works on
    const stat = ' · ' + statusText(a) + (a.active ? ' · ' + t('thisSession') : '');
    const desc = clip(descOf(a), 44), name = nameOf(a);
    ctx.font = '600 11.5px ui-sans-serif, system-ui'; const wn = ctx.measureText(name).width;
    ctx.font = '10.5px ui-sans-serif, system-ui'; const ws = ctx.measureText(stat).width, wd = ctx.measureText(desc).width;
    const pw = Math.max(wn + ws, wd) + 20, ph = 38;
    const right = a.x >= you.x ? a.x + 46 * K + pw < availW : a.x - 46 * K - pw < 0;
    const px = right ? a.x + 46 * K - 10 : a.x - 46 * K - pw + 10, py = a.y - 16;
    a.label = { x: px, y: py, w: pw, h: ph };
    agentLabels.push({ a, stat, desc, name, wn, px, py, pw, ph });
  }

  // 1) subagents (bottom): role and what they were asked to do; finished ones first, so the
  //    working ones always paint over them
  for (const done of [true, false]) for (const a of agents) {
    const focused = focus === a;
    for (const s of a.subs) {
      if ((s.status !== 'run') !== done) continue;
      const off = s.status !== 'run';
      const role = s.role || t('subagent'), d = clip(s.description, 30);
      ctx.font = '600 10px ui-sans-serif, system-ui'; const w1 = ctx.measureText(role).width;
      ctx.font = '9.5px ui-sans-serif, system-ui'; const w2 = d ? ctx.measureText(d).width : 0;
      const sw = Math.max(w1, w2) + 14, sh = d ? 30 : 17, sx = s.x - sw / 2, sy = s.y + 20 * K;
      const alpha = (off ? 0.55 : 0.9) * (focused ? 1 : 0.85);
      pill(sx, sy, sw, sh, alpha, focused && selectedSub === s.id ? 'rgba(255,255,255,0.45)' : null);
      s.label = { x: sx, y: sy, w: sw, h: sh };
      ctx.textAlign = 'center'; ctx.globalAlpha = alpha;
      ctx.font = '600 10px ui-sans-serif, system-ui'; ctx.fillStyle = ST[s.status] || '#d2d2dc';
      ctx.fillText(role, s.x, sy + 12);
      if (d) { ctx.font = '9.5px ui-sans-serif, system-ui'; ctx.fillStyle = 'rgba(220,220,230,0.85)'; ctx.fillText(d, s.x, sy + 25); }
      ctx.globalAlpha = 1;
    }
  }

  // 2) agents (middle): node and label are painted over any subagent label beneath
  for (const { a, stat, desc, name, wn, px, py, pw, ph } of agentLabels) {
    const dim = a.status === 'done' || a.status === 'stopped';
    redrawCluster(a);
    const open = selected === a.id;
    pill(px, py, pw, ph, dim ? 0.6 : 1, open ? 'rgba(255,255,255,0.45)' : (a.status === 'need' || a.status === 'approve') ? ST[a.status] + '66' : null);
    ctx.textAlign = 'left';
    ctx.globalAlpha = dim ? 0.6 : 1;
    ctx.font = '600 11.5px ui-sans-serif, system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.94)';
    ctx.fillText(name, px + 10, a.y - 1);
    ctx.font = '10.5px ui-sans-serif, system-ui'; ctx.fillStyle = ST[a.status];
    ctx.fillText(stat, px + 10 + wn, a.y - 1);
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    ctx.fillText(desc, px + 10, a.y + 13);
    ctx.globalAlpha = 1;
  }

  // 3) You / main (top)
  let lyou = 74 * K;
  const waiting = agents.filter(a => a.status === 'need' || a.status === 'approve').length;
  // a single agent is you: the You label carries its status and what it works on
  const ysub = solo ? statusText(solo) : waiting ? t('waitingOnYou', { n: waiting }) : t('nothingWaiting');
  const ydesc = solo ? clip(descOf(solo), 48) : '';
  const youText = t('you');
  ctx.font = '600 13px ui-sans-serif, system-ui'; const yw1 = ctx.measureText(youText).width;
  ctx.font = '10.5px ui-sans-serif, system-ui'; const yw2 = ctx.measureText(ysub).width, yw3 = ydesc ? ctx.measureText(ydesc).width : 0;
  const ypw = Math.max(yw1, yw2, yw3) + 20, yph = ydesc ? 52 : 38;
  // put the You label above you when an agent's label sits where it would go
  const youRect = dy => ({ x: you.x - ypw / 2, y: you.y + dy - 15, w: ypw, h: yph });
  const overlaps = r => agents.some(a => a.label && !(r.x > a.label.x + a.label.w || r.x + r.w < a.label.x || r.y > a.label.y + a.label.h || r.y + r.h < a.label.y));
  if (overlaps(youRect(lyou)) && !overlaps(youRect(-74 * K - yph + 16))) lyou = -74 * K - yph + 16;
  you.label = youRect(lyou);
  redrawCluster(you);
  const soloAsks = solo && (solo.status === 'need' || solo.status === 'approve');
  pill(you.x - ypw / 2, you.y + lyou - 15, ypw, yph, 1, solo && selected === solo.id ? 'rgba(255,255,255,0.45)' : soloAsks ? ST[solo.status] + '66' : null);
  ctx.textAlign = 'center';
  ctx.font = '600 13px ui-sans-serif, system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.96)';
  ctx.fillText(youText, you.x, you.y + lyou);
  ctx.font = '10.5px ui-sans-serif, system-ui'; ctx.fillStyle = solo ? ST[solo.status] : 'rgba(216,200,255,0.85)';
  ctx.fillText(ysub, you.x, you.y + lyou + 15);
  if (ydesc) { ctx.fillStyle = 'rgba(255,255,255,0.62)'; ctx.fillText(ydesc, you.x, you.y + lyou + 29); }
}

let last = now(), lastStep = 0;
function step() {
  // the work panel may mount this page hidden (0×0) and later show it without a resize event
  if (innerWidth !== W || innerHeight !== H) resize();
  const t = now();
  const dt = Math.min(0.05, t - last); last = t;
  update(dt, t);
  draw(t);
  lastStep = performance.now();
}
function frame() { step(); requestAnimationFrame(frame); }
// The host can attach this page without telling Chromium it became visible, which pauses
// requestAnimationFrame. A timer keeps the picture alive until animation frames resume.
// It only runs while the page has a size: a hidden work panel is 0×0 and needs no drawing.
setInterval(() => {
  if (!shown()) return;
  if (pullSlow) { clearTimeout(pullTimer); pull(); } // just became visible: fetch now
  if (performance.now() - lastStep > 400) step();
}, 250);
addEventListener('focus', () => step());

// ---------- interaction ----------
function hitTest(x, y) {
  const order = [...agents].sort((p, q) => q.attention - p.attention);
  const inRect = L => L && x >= L.x && x <= L.x + L.w && y >= L.y && y <= L.y + L.h;
  // same order as drawn, top first: You (main) > agents > subagents
  const onYou = Math.hypot(x - you.x, y - you.y) < 62 * K || inRect(you.label);
  // a single agent is you: the centre stands for it
  if (onYou) return solo ? { a: solo, you: true } : { you: true };
  for (const a of order) {
    if (a === solo) continue;
    if (Math.hypot(x - a.x, y - a.y) < 42 * K || inRect(a.label)) return { a };
  }
  for (const a of order) for (const s of a.subs) if (Math.hypot(x - s.x, y - s.y) < 20 * K || inRect(s.label)) return { a, s };
  return null;
}
canvas.addEventListener('mousemove', e => {
  hover = hitTest(e.clientX, e.clientY);
  canvas.style.cursor = hover ? 'pointer' : 'default';
});
canvas.addEventListener('mouseleave', () => { hover = null; });
canvas.addEventListener('click', e => {
  const h = hitTest(e.clientX, e.clientY);
  if (!h) { select(null); return; }
  if (h.a && !h.s && selected === h.a.id) { select(null); return; } // clicking the open agent again closes the drawer
  if (!h.a) {
    // clicking You toggles the drawer: close it when open, otherwise open the agent that needs you most
    if (selected) { select(null); return; }
    const top = [...agents].sort((p, q) => q.attention - p.attention)[0];
    if (top) select(top.id);
    return;
  }
  select(h.a.id, h.s?.id || null);
});
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });
addEventListener('resize', () => { resize(); });
// the work panel can mount this page while it is hidden (0×0); size the canvas whenever the panel really shows
new ResizeObserver(() => { if (innerWidth !== W || innerHeight !== H) resize(); }).observe(document.documentElement);
document.addEventListener('visibilitychange', () => { if (!document.hidden) resize(); });

function select(id, subId = null) {
  if (selected !== id) { draft = ''; logOpen = false; }
  selected = id; selectedSub = subId; panelSig = '';
  computeView();
  renderPanel();
}

// ---------- intervention: your signal travels back through the network to the agent ----------
function fire(a, color = YOU_SIGNAL) {
  you.flash = 1;
  spike(you.hub, a.hub, color, 300 * K, () => { a.flash = 1; });
}
let toastTimer = 0;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
async function act(a, payload, color, done) {
  fire(a, color);
  try {
    const r = await window.pluginBridge.invoke('radar.action', { sessionId: a.id, ...payload });
    if (!r?.ok) toast(r?.code && COPY.en['err_' + r.code] ? t('err_' + r.code) : r?.message || t('toastFailed'));
    else if (done) toast(done);
    return r;
  } catch (e) { toast(String(e?.message || e)); }
}

// ---------- DOM ----------
const panel = document.getElementById('panel');
const queueEl = document.getElementById('queue');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clock = t => t ? new Date(t).toTimeString().slice(0, 8) : '';

function renderEmpty() {
  const el = document.getElementById('emptyState');
  el.textContent = connected === false ? t('emptyConnecting')
    : lastError ? t('emptyError', { error: lastError })
    : agents.length ? '' : t('emptyNone');
}

function renderQueue() {
  const waiting = agents.filter(a => a.status === 'need' || a.status === 'approve').sort((a, b) => b.attention - a.attention);
  queueEl.innerHTML = waiting.map(a => `<button class="chip" data-id="${esc(a.id)}"><span class="dot" style="color:${ST[a.status]}"></span>${esc(a === solo ? t('you') : nameOf(a, 24))} · ${esc(clip(descOf(a), 32))}</button>`).join('');
  queueEl.querySelectorAll('[data-id]').forEach(b => b.onclick = () => select(selected === b.dataset.id ? null : b.dataset.id));
}

const armed = new Map(); // two-step confirmation for Stop / Abort
function renderPanel() {
  const a = agents.find(x => x.id === selected);
  if (!a) { panel.classList.remove('open'); selected = null; computeView(); return; }
  const focused = document.activeElement?.id === 'draft';
  const logScroll = panel.querySelector('.log')?.scrollTop ?? 0;
  const col = ST[a.status];
  const live = a.status !== 'done';
  const q = a.question, p = a.plan;
  const nRun = a.subs.filter(s => s.status === 'run').length;
  const armedStop = armed.get('stop') === a.id, armedAbort = armed.get('abort') === a.id;
  panel.innerHTML = `
    <button class="btn ghost close" data-act="close" aria-label="${esc(t('close'))}">✕</button>
    <h2><span class="dot" style="color:${col}"></span>${esc(nameOf(a, 40))}${a === solo ? `<span style="color:var(--muted);font-weight:400">${esc(t('youTag'))}</span>` : ''}</h2>
    <div style="color:var(--muted);margin-top:4px">${esc(taskOf(a))}</div>
    <span class="status" style="color:${col}">${esc(a.reply ? t('needsReply') : statusLabel(a.status))}${a.active ? ' · ' + esc(t('thisSession')) : ''}</span>
    <div class="meta" style="margin-top:10px"><span>${esc(a.model || '')}</span><span>${nRun ? esc(plural(nRun, 'subsWorkingOne', 'subsWorkingMany')) : ''}</span></div>

    ${q ? `<div class="section"><h4>${esc(t('questionForYou'))}</h4>
      <div class="ask">${q.ctx ? `<div class="ctx">${esc(q.ctx)}</div>` : ''}<p>${esc(q.q)}</p>
        ${q.opts?.length ? `<div class="chips">${q.opts.map(o => `<span>${esc(o)}</span>`).join('')}</div>` : ''}
        ${q.more ? `<div class="note">${esc(plural(q.more, 'moreQuestionsOne', 'moreQuestionsMany'))}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="open">${esc(t('answerInSession'))}</button></div>
        <div class="note">${esc(t('answerNote'))}</div>
      </div></div>` : ''}

    ${a.reply ? `<div class="section"><h4>${esc(t('waitingReply'))}</h4>
      <div class="ask">${a.replyContext ? `<div class="ctx">${esc(a.replyContext)}</div>` : ''}<p>${esc(a.reply)}</p>
        <div class="note">${esc(t('replyNote'))}</div>
      </div></div>` : ''}

    ${p ? `<div class="section"><h4>${esc(t(p.kind === 'goal' ? 'goalWaiting' : 'planWaiting'))}</h4>
      <div class="ask"><p>${esc(p.title || t(p.kind === 'goal' ? 'goalReady' : 'planReady'))}</p>${p.question ? `<div class="note">${esc(p.question)}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="approve">${esc(t('approve'))}</button><button class="btn danger" data-act="reject">${esc(t('reject'))}</button><button class="btn" data-act="open">${esc(t('reviewInSession'))}</button></div>
        <div class="note">${esc(t('approveNote'))}</div>
      </div></div>` : ''}

    ${live || a.reply ? `<div class="section"><h4>${esc(t(a.reply ? 'replyToAgent' : 'messageAgent'))}</h4>
      <textarea id="draft" placeholder="${esc(t('draftPlaceholder'))}">${esc(draft)}</textarea>
      <div class="sendrow"><span>${esc(t('sendHint'))}</span><button class="btn" data-act="prefill">${esc(t('prefill'))}</button><button class="btn primary" data-act="send">${esc(t('sendToAgent'))}</button></div></div>` : ''}

    <div class="section"><h4>${esc(t('intervene'))}</h4>
      <div class="actions">
        <button class="btn" data-act="open">${esc(t('openSession'))}</button>
        <button class="btn danger ${armedStop ? 'confirm' : ''}" data-act="stop" ${live && !a.reply ? '' : 'disabled'}>${esc(t(armedStop ? 'confirmStop' : 'stop'))}</button>
        <button class="btn danger ${armedAbort ? 'confirm' : ''}" data-act="abort" ${live && !a.reply ? '' : 'disabled'}>${esc(t(armedAbort ? 'confirmAbort' : 'abort'))}</button>
      </div>
      <div class="note">${esc(t('stopNote'))}</div></div>

    <div class="section"><h4>${esc(t('subagentsHeading', { n: a.subs.length }))}</h4>
      ${a.subs.length ? a.subs.map(s => `<div class="sub ${selectedSub === s.id ? 'hl' : ''}">
          <span class="dot" style="color:${ST[s.status] || '#6b7080'}"></span>
          <div class="n">${esc(s.role || t('subagent'))}<small>${esc(s.description || '')}</small><small>${esc(statusLabel(s.status))}${s.toolCalls ? ` · ${esc(t('toolCalls', { n: s.toolCalls }))}` : ''}${s.lastTool ? ` · ${esc(t('lastTool', { tool: s.lastTool }))}` : ''}</small></div>
        </div>`).join('') : `<div class="empty">${esc(t('noSubagents'))}</div>`}
    </div>

    <div class="section"><h4 class="fold ${logOpen ? 'open' : ''}" data-act="log" role="button" tabindex="0" aria-expanded="${logOpen}"><span class="caret">▸</span>${esc(t('activityHeading', { n: (a.log || []).length }))}</h4>
      ${logOpen ? `<div class="log">${(a.log || []).map(l => `<div class="${l.kind === 'you' ? 'you' : ''}"><time>${clock(l.t)}</time>${esc(logLine(l))}</div>`).join('') || `<div class="empty">${esc(t('nothingYet'))}</div>`}</div>` : ''}
    </div>`;
  panel.classList.add('open');
  const logEl = panel.querySelector('.log');
  if (logEl) logEl.scrollTop = logScroll;

  const ta = panel.querySelector('#draft');
  if (ta) {
    ta.oninput = () => { draft = ta.value; };
    ta.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(a); } };
    if (focused) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  panel.querySelectorAll('[data-act]').forEach(b => b.onclick = () => onAction(a, b.dataset.act));
  panel.querySelector('.fold')?.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onAction(a, 'log'); } });
}

function send(a) {
  const text = draft.trim();
  if (!text) return;
  draft = '';
  act(a, { action: 'send', text }, YOU_SIGNAL, t('toastSent'));
  renderPanel();
}

function onAction(a, k) {
  if (k === 'close') return select(null);
  if (k === 'log') { logOpen = !logOpen; return renderPanel(); }
  if (k === 'open') return act(a, { action: 'open' });
  if (k === 'prefill') { const text = draft.trim(); return act(a, { action: 'prefill', text }, YOU_SIGNAL, text ? t('toastSuggested') : null); }
  if (k === 'send') return send(a);
  if (k === 'approve' || k === 'reject') return act(a, { action: 'plan', decision: k, proposal: a.plan }, k === 'approve' ? YOU_SIGNAL : '#ff6b9a', t(k === 'approve' ? 'toastApproved' : 'toastRejected'));
  if (k === 'stop' || k === 'abort') {
    if (armed.get(k) !== a.id) {
      armed.set(k, a.id); renderPanel();
      setTimeout(() => { if (armed.get(k) === a.id) { armed.delete(k); renderPanel(); } }, 3000);
      return;
    }
    armed.delete(k);
    act(a, { action: k }, '#ff6b9a', t(k === 'stop' ? 'toastStop' : 'toastAborted'));
    renderPanel();
  }
}

// language: follow the host's appearance; re-word everything on screen when it changes
function applyAppearance(appearance) {
  const next = pickLocale(appearance?.locale || navigator.language);
  const changed = next !== locale;
  locale = next;
  document.documentElement.lang = locale;
  document.title = t('title');
  if (changed) { renderQueue(); renderEmpty(); if (selected) renderPanel(); }
}
applyAppearance(null);
window.pluginBridge?.on?.('appearance:changed', applyAppearance);
Promise.resolve(window.pluginBridge?.invoke?.('app.getAppearance')).then(applyAppearance).catch(() => applyAppearance(null));

resize();
renderQueue();
renderEmpty();
requestAnimationFrame(frame);
pull();
})();
</script>
</body>
</html>
